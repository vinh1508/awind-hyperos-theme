name: Build MTZ (Redmi K80 Pro POC)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      ui_version:
        description: 'uiVersion (thu nghiem, mac dinh 17)'
        required: true
        type: string
        default: '17'
      adapter_version:
        description: 'miuiAdapterVersion (thu nghiem, mac dinh 5.0)'
        required: true
        type: string
        default: '5.0'
      only_apk_confirmed:
        description: 'Chi build nhung chuoi da xac minh ID tu APK'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mtz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and upload MTZ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      filename: ${{ steps.version.outputs.filename }}
      theme_version: ${{ steps.version.outputs.version }}
    env:
      UI_VERSION: ${{ inputs.ui_version || '17' }}
      ADAPTER_VERSION: ${{ inputs.adapter_version || '5.0' }}
      ONLY_APK_CONFIRMED: ${{ inputs.only_apk_confirmed && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compute version and filename from GitHub run or tag
        id: version
        run: python tools/ci_version.py

      - name: Build MTZ
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$ONLY_APK_CONFIRMED" == 'true' ]]; then
            options+=(--only-apk-confirmed)
          fi
          python tools/mtz_tool.py build \
            --csv translations.csv \
            --out "$THEME_PATH" \
            --theme-version "$THEME_VERSION" \
            --ui-version "$UI_VERSION" \
            --adapter-version "$ADAPTER_VERSION" \
            "${options[@]}"

      - name: Validate output and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python tools/mtz_tool.py inspect "$THEME_PATH"
          test -s "$THEME_PATH"
          sha256sum "$THEME_PATH" > "$THEME_PATH.sha256"
          {
            echo '### Redmi K80 Pro POC — build result'
            echo ''
            echo "**Metadata version:** $THEME_VERSION"
            echo "**MTZ filename:** $(basename "$THEME_PATH")"
            echo ''
            echo 'ZIP/XML valid. This does **not** confirm actual theme import or localization on the phone.'
            echo ''
            echo '**SHA-256:**'
            echo '```text'
            cat "$THEME_PATH.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # archive:false uploads the .mtz directly, using its actual basename as artifact name.
      - name: Upload MTZ directly (without extra ZIP)
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.version.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add artifact link to job summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: echo "[Download MTZ from this run]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish prerelease from semantic version tag
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download dynamically named MTZ
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.filename }}
          path: dist/

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THEME_FILE: ${{ needs.build.outputs.filename }}
        run: |
          set -euo pipefail
          theme_path="dist/$THEME_FILE"
          test -s "$theme_path"
          sha256sum "$theme_path" > "$theme_path.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$theme_path" "$theme_path.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$theme_path" "$theme_path.sha256" \
              --title "ViHoa Redmi K80 Pro POC $GITHUB_REF_NAME" \
              --notes 'Experimental MTZ POC. ZIP/XML validation only; import and localization on a real device are unverified.' \
              --prerelease
          fi
